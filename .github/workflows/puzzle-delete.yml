name: Suppression d'un problème (via Issue)

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  actions: write   # pour déclencher explicitement le déploiement Pages (voir scripts/puzzle-delete.js)

concurrency:
  group: puzzle-intake
  cancel-in-progress: false

jobs:
  delete:
    if: contains(github.event.issue.labels.*.name, 'delete-puzzle')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vérifie le mot de passe et supprime le(s) problème(s)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          DELETE_PASSWORD: ${{ secrets.PUZZLE_DELETE_PASSWORD }}
        run: node scripts/puzzle-delete.js
