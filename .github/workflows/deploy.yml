name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupère le dépôt
        uses: actions/checkout@v4

      - name: Prépare les fichiers (dossier public/)
        uses: actions/configure-pages@v5

      - name: Empaquette public/ comme artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publie sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
