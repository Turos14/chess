name: Modification d'un problème (via Issue)

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write   # pour déclencher explicitement le déploiement Pages (voir scripts/puzzle-common.js)

concurrency:
  group: puzzle-intake
  cancel-in-progress: false

jobs:
  edit:
    # N'importe qui peut ouvrir un ticket "edit-puzzle" (étiquette automatique du template), mais seul l'ajout de
    # l'étiquette "edit-approved" — posée à la main par Turos14 depuis GitHub une fois la demande vérifiée — lance
    # la modification. Volontairement limité à l'évènement "labeled" de cette étiquette (pas "edited") : le contenu
    # du ticket ne peut donc pas être changé après approbation sans une nouvelle approbation (retirer puis
    # remettre l'étiquette).
    if: github.event.label.name == 'edit-approved' && contains(github.event.issue.labels.*.name, 'edit-puzzle')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Modifie le problème
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/puzzle-edit.js
