name: Ajout d'un problème (via Issue)

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  actions: write   # pour déclencher explicitement le déploiement Pages (voir scripts/puzzle-intake.js)

concurrency:
  group: puzzle-intake
  cancel-in-progress: false

jobs:
  intake:
    # Deux circuits :
    #  - ticket ouvert directement sur GitHub (étiquette "puzzle") : traité automatiquement à l'ouverture et à
    #    chaque modification ;
    #  - proposition envoyée depuis l'appli via le relais (relais/, sans compte GitHub, étiquette
    #    "puzzle-pending") : traitée seulement quand Turos14 ajoute l'étiquette "puzzle-approved" (uniquement sur
    #    cet évènement "labeled" : le ticket ne peut pas être changé après approbation sans nouvelle approbation).
    if: >-
      (github.event.action != 'labeled' && contains(github.event.issue.labels.*.name, 'puzzle')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'puzzle-approved' &&
       contains(github.event.issue.labels.*.name, 'puzzle-pending'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Valide et intègre le problème
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LOGIN: ${{ github.event.issue.user.login }}
        run: node scripts/puzzle-intake.js
