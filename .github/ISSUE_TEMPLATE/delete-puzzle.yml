name: "Supprimer un problème"
description: "Demander la suppression d'un ou plusieurs problèmes de la liste publique"
title: "[Suppression] "
labels: ["delete-puzzle"]
body:
  - type: markdown
    attributes:
      value: |
        N'importe qui peut ouvrir ce ticket, mais il n'est **pas traité automatiquement** : seul Turos14 peut le
        faire aboutir, en ajoutant manuellement l'étiquette `delete-approved` une fois la demande vérifiée.
  - type: input
    id: ids
    attributes:
      label: Identifiant(s) du/des problème(s)
      description: "Un ou plusieurs identifiants (ex : gh-42), séparés par des espaces."
      placeholder: "gh-42 gh-57"
    validations:
      required: true
  - type: input
    id: reason
    attributes:
      label: Raison (optionnel)
      placeholder: "Doublon, solution invalide, contenu inapproprié…"
