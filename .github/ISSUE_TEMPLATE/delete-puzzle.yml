name: "Supprimer un problème"
description: "Demander la suppression d'un ou plusieurs problèmes de la liste publique (mot de passe requis)"
title: "[Suppression] "
labels: ["delete-puzzle"]
body:
  - type: markdown
    attributes:
      value: |
        Une vérification automatique n'accepte cette demande que si le bon **mot de passe** est fourni ci-dessous.
        Sinon elle est automatiquement refusée et ce ticket est fermé. ⚠️ Ce ticket est **public** : n'importe qui
        peut lire ce que tu écris ici (le mot de passe est effacé du ticket par l'automatisation juste après
        lecture, mais reste visible un court instant, et potentiellement dans l'historique de modification).
  - type: input
    id: password
    attributes:
      label: Mot de passe
    validations:
      required: true
  - type: input
    id: ids
    attributes:
      label: Identifiant(s) du/des problème(s)
      description: "Un ou plusieurs identifiants (ex : gh-42), séparés par des espaces."
      placeholder: "gh-42 gh-57"
    validations:
      required: true
  - type: input
    id: reason
    attributes:
      label: Raison (optionnel)
      placeholder: "Doublon, solution invalide, contenu inapproprié…"
